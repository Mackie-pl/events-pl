name: daily-events
on:
  schedule:
    - cron: "0 4 * * *" # codziennie 6:00 czasu PL (lato)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # przeglądarka dla źródeł fetch:headless i fallbacku po HTTP 403 (~1 min)
      - run: npx playwright install --with-deps chromium
      - run: npm run daily
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # prywatne archiwum treści (opcjonalne — bez tych sekretów pipeline działa bez zmian).
          # Ustaw JEDEN z kluczy: SECRET (nowe projekty, sb_secret_…) albo SERVICE_ROLE (starsze, JWT).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Bright Data (FB): rozwiązywanie linków do wydarzeń + otwarte grupy jako źródła.
          # Bez tego sekretu FB jest pomijany (tryb zero-cost) — reszta pipeline działa normalnie.
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          # opcjonalna ewaluacja modeli:
          # MODEL_EXTRACT: anthropic/claude-haiku-4.5
      - name: Commit results
        run: |
          git config user.name "events-bot"
          git config user.email "bot@users.noreply.github.com"
          # costs.json: księga wydatków. Bez commitu przebieg liczyłby koszt i od razu
          # o nim zapominał — panel czyta ją z repo, nie z artefaktów Actions.
          # audit.json: ślad decyzyjny, retencja 7 dni RÓWNOLEGLE do runs.json — i przez
          # przeoczenie nie było go na tej liście, więc każdy przebieg crona zapisywał ślad
          # na runnerze i wyrzucał razem z nim. W repo stały ślady wyłącznie z przebiegów
          # ręcznych, a panel pokazywał pustą zakładkę dla wszystkich pozostałych.
          git add events.json index.html state.json runs.json costs.json audit.json
          git add brightdata-usage.jsonl 2>/dev/null || true # istnieje tylko gdy BRIGHTDATA_API_KEY ustawiony
          git diff --cached --quiet || git commit -m "daily $(date +%F)"
          git push
