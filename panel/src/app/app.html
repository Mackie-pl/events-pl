<tui-root>
  <div class="shell">
    <header class="topbar">
      <a routerLink="/" class="brand">
        <tui-icon icon="@tui.activity" />
        <strong>events-pl</strong>
        <span class="muted">observability</span>
      </a>
      <nav class="nav">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          Day
        </a>
        <a routerLink="/discovery" routerLinkActive="active">Discovery</a>
        <a routerLink="/costs" routerLinkActive="active">Money</a>
        <a routerLink="/reuse" routerLinkActive="active">Reuse</a>
        <a routerLink="/yield" routerLinkActive="active">Yield</a>
        <a routerLink="/config" routerLinkActive="active">Config</a>
      </nav>
      <span class="spacer"></span>
      <!-- Skąd dane. Bez tego „czemu nie widzę swojego przebiegu?" jest nie do rozstrzygnięcia
           z ekranu: panel wygląda identycznie, czy czyta drzewo robocze, czy gałąź main. -->
      <span
        class="origin"
        [class.origin--local]="data.local()"
        [title]="
          data.local()
            ? 'Dane z drzewa roboczego (panel-server) — także niezacommitowane przebiegi'
            : 'Dane z gałęzi main na GitHubie. Uruchom `npm run panel-server`, żeby widzieć lokalne przebiegi'
        "
      >
        <tui-icon [icon]="data.local() ? '@tui.hard-drive' : '@tui.cloud'" />
        {{ data.local() ? 'local' : 'main' }}
      </span>
      @if (data.sources.value(); as s) {
        <span class="muted region">{{ s.region.name }} · {{ s.sources.length }} sources</span>
      }
      <a
        tuiButton
        appearance="secondary"
        size="s"
        href="https://github.com/Mackie-pl/events-pl"
        target="_blank"
        rel="noopener"
      >
        GitHub
      </a>
      <button
        tuiButton
        appearance="primary"
        size="s"
        [disabled]="data.loading()"
        (click)="data.reloadAll()"
      >
        Refresh
      </button>
    </header>
    <main class="content">
      <router-outlet />
    </main>
  </div>
</tui-root>
